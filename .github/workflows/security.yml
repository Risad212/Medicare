name: Security

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit
        run: composer audit

      - name: Pint check
        run: vendor/bin/pint --test

      - name: PHP syntax check
        run: |
          php -l app/Http/Controllers/Admin/SliderController.php
          php -l app/Http/Controllers/Admin/DoctorController.php
          php -l app/Http/Controllers/Admin/BlogController.php
          php -l app/Http/Controllers/Doctor/DoctorProfileController.php

      - name: PHPUnit (Unit + Feature)
        run: vendor/bin/phpunit --testsuite=Unit,Feature
