# Wasmer Edge app configuration for MediCare (Laravel/PHP)
# Deploy with: wasmer deploy --build-remote --non-interactive
#
# State model: the seeded SQLite database and all public media ship inside
# the deployed package, so every deploy resets the app to the committed
# state (local dev database == live database). Edits made in the live admin
# panel are lost on the next deploy/instance restart — change content in
# your local repo and redeploy instead.
#
# ATTENTION: this file previously mounted a persistent volume over
# /app/storage/app/public. That mount would hide the packaged media with an
# (empty) volume, which is why banner images vanished on the live site.
# Removing it below deletes the now-empty volume data on the next deploy.
kind: wasmer.io/App.v0
name: medicare
owner: risad212
package: .

env:
  APP_ENV: production
  APP_DEBUG: "false"

volumes:
  - name: medicare-uploads
    mount: /app/storage/app/storage