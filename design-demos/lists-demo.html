<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediCare admin — Lists demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .mx{--bg:#fafafa;--card:#fff;--line:#e4e4e7;--line2:#f0f0f2;--ink:#18181b;--ink2:#3f3f46;--mut:#71717a;--faint:#a1a1aa;
    --teal:#0b8f74;--teal-dk:#0a7c63;--teal-bright:#05d3b0;--teal-wash:#e6faf5;
    --amber-t:#92400e;--amber-bg:#fef3c7;--amber-dot:#d97706;
    --green-t:#03695c;--green-bg:#dcf7ef;
    --grey-t:#52525b;--grey-bg:#f1f1f3;
    --red:#dc2626;--red-bg:#fef2f2;--red-t:#991b1b;
    --blue-t:#1d4ed8;--blue-bg:#eff6ff;
    --r:12px;--sh:0 1px 2px rgba(24,24,27,.05),0 6px 18px rgba(24,24,27,.05);
    --disp:"Fraunces",Georgia,serif;--body:"Public Sans",-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;
    max-width:1180px;margin:0 auto;padding:28px 30px 60px}
  .mx *{box-sizing:border-box}
  /* module tabs */
  .mx-mods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .mx-mods button{font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink2);background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:8px 16px;cursor:pointer;transition:border-color .15s,color .15s}
  .mx-mods button:hover{border-color:var(--teal)}
  .mx-mods button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  /* chart header */
  .mx-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:6px}
  .mx-kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-dk);margin:0 0 6px}
  .mx-title{font-family:var(--disp);font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:0}
  .mx-title em{font-style:normal;color:var(--teal)}
  .mx-sub{color:var(--mut);margin:8px 0 0;max-width:560px}
  .mx-add{background:var(--teal);color:#fff;border:1px solid var(--teal);border-radius:10px;font-weight:700;font-size:14px;
    padding:11px 20px;cursor:pointer;box-shadow:var(--sh);font-family:var(--body)}
  .mx-add:hover{background:var(--teal-dk)}
  /* vitals strip */
  .mx-vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
  @media(max-width:760px){.mx-vitals{grid-template-columns:repeat(2,1fr)}}
  .mx-v{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
  .mx-v::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal)}
  .mx-v.warn::before{background:var(--amber-dot)}
  .mx-v.bad::before{background:var(--red)}
  .mx-v .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
  .mx-v .v{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
  .mx-v .s{font-size:12px;color:var(--mut)}
  /* ecg divider */
  .mx-ecg{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:var(--faint);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .mx-ecg svg{flex:1;height:22px}
  /* toolbar */
  .mx-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);margin-bottom:14px}
  .mx-search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:#fff}
  .mx-search:focus-within{border-color:var(--teal)}
  .mx-search svg{flex:0 0 16px}
  .mx-search input{border:0;outline:0;font-family:var(--body);font-size:14px;padding:10px 0;width:100%;background:transparent;color:var(--ink)}
  .mx-filters{display:flex;gap:8px;flex-wrap:wrap}
  .mx-filters button{font-family:var(--body);font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink2);
    border-radius:20px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .mx-filters button.on{border-color:var(--teal-dk);color:var(--teal-dk);background:var(--teal-wash)}
  .mx-dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  /* table card */
  .mx-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
  table.mx-tbl{width:100%;border-collapse:collapse;font-size:14px}
  .mx-tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;text-align:left;
    padding:11px 18px;border-bottom:1px solid var(--line);background:#fcfcfd;white-space:nowrap}
  .mx-tbl td{padding:13px 18px;border-bottom:1px solid var(--line2);vertical-align:middle;background:#fff}
  .mx-tbl tbody tr{transition:background .12s}
  .mx-tbl tbody tr:hover td{background:var(--teal-wash)}
  .mx-tbl tbody tr:last-child td{border-bottom:none}
  .mx-idx{font-family:var(--disp);font-size:19px;color:var(--faint);font-variant-numeric:tabular-nums}
  .mx-who{display:flex;align-items:center;gap:11px;min-width:170px}
  .mx-av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex:0 0 34px}
  .mx-av.t{background:var(--teal)}.mx-av.a{background:var(--amber-dot)}.mx-av.b{background:var(--blue-t)}.mx-av.r{background:var(--red)}
  .mx-who b{display:block;font-size:14px}
  .mx-who span{font-size:12px;color:var(--mut)}
  .mx-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;border-radius:20px;padding:4px 12px;white-space:nowrap}
  .mx-pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .p-pending{background:var(--amber-bg);color:var(--amber-t)}
  .p-confirmed,.p-active,.p-published,.p-paid,.p-completed{background:var(--green-bg);color:var(--green-t)}
  .p-cancelled,.p-inactive,.p-draft,.p-void{background:var(--grey-bg);color:var(--grey-t)}
  .p-urgent,.p-overdue{background:var(--red-bg);color:var(--red-t)}
  .p-info{background:var(--blue-bg);color:var(--blue-t)}
  .mx-num{font-variant-numeric:tabular-nums;font-weight:600}
  .mx-acts{display:flex;gap:6px;justify-content:flex-end}
  .mx-acts button{font-family:var(--body);font-size:12px;font-weight:700;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink2)}
  .mx-acts button:hover{border-color:var(--teal-dk);color:var(--teal-dk)}
  .mx-acts button.pri{background:var(--ink);border-color:var(--ink);color:#fff}
  .mx-acts button.pri:hover{background:var(--teal-dk);border-color:var(--teal-dk)}
  .mx-acts button.danger:hover{border-color:var(--red);color:var(--red)}
  .mx-empty{padding:44px 20px;text-align:center;color:var(--mut)}
  .mx-empty b{display:block;font-family:var(--disp);font-size:22px;color:var(--ink);margin-bottom:6px}
  /* pagination */
  .mx-pg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid var(--line2);font-size:13px;color:var(--mut);flex-wrap:wrap}
  .mx-pg nav{display:flex;gap:6px}
  .mx-pg nav button{font-family:var(--body);min-width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;
    font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer}
  .mx-pg nav button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .mx-pg nav button:disabled{opacity:.4;cursor:default}
  .mx-note{margin-top:16px;font-size:12px;color:var(--mut)}
  @media(max-width:760px){.mx-title{font-size:30px}.mx-acts{justify-content:flex-start}}
</style>
</head>
<body>
<div class="mx">
  <div class="mx-mods" id="mods"></div>

  <div class="mx-hero">
    <div>
      <p class="mx-kicker" id="kicker">MediCare · Admin</p>
      <h1 class="mx-title" id="title"></h1>
      <p class="mx-sub" id="sub"></p>
    </div>
    <button class="mx-add" id="addBtn">+ Add new</button>
  </div>

  <div class="mx-vitals" id="vitals"></div>

  <div class="mx-ecg"><span>Live register</span><svg viewBox="0 0 400 22" preserveAspectRatio="none"><polyline points="0,11 60,11 70,11 76,11 82,3 88,19 94,11 150,11 160,11 166,11 172,4 178,18 184,11 260,11 400,11" fill="none" stroke="#05d3b0" stroke-width="1.6"/></svg><span id="rowCount"></span></div>

  <div class="mx-bar">
    <label class="mx-search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#71717a" stroke-width="2"><circle cx="7" cy="7" r="5"/><line x1="11" y1="11" x2="15" y2="15"/></svg>
      <input id="q" type="search" placeholder="Search this register…" autocomplete="off">
    </label>
    <div class="mx-filters" id="filters"></div>
  </div>

  <div class="mx-card">
    <div style="overflow-x:auto">
    <table class="mx-tbl">
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
    </div>
    <div class="mx-pg">
      <span id="pgInfo"></span>
      <nav id="pgNav"></nav>
    </div>
  </div>

  <p class="mx-note">Demo — static mock data mirroring the real columns. Real build keeps server-side search/pagination; JS here only previews the interaction.</p>
</div>

<script>
const AV = ['t','a','b','r',''];
const initials = n => n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const pill = (label, cls) => `<span class="mx-pill ${cls}"><i></i>${label}</span>`;

const MODULES = {
  appointments: {

    add:'+ Book appointment',

    cols:['#','Patient','Doctor','Schedule','Visit','Status','Actions'],
    rows:[
      {p:['Rahim Uddin','01711-223344'],d:['Dr. Ayesha Rahman','Cardiology'],s:'Sat, Sep 13 · 10:00 AM',v:'First Visit',st:['Pending','p-pending']},
      {p:['Sara Khan','01812-998877'],d:['Dr. Tanvir Hasan','Orthopedics'],s:'Sat, Sep 13 · 02:00 PM',v:'Report Review',st:['Confirmed','p-confirmed']},
      {p:['Karim Sheikh','01933-445566'],d:['Dr. Nusrat Jahan','Pediatrics'],s:'Sun, Sep 14 · 09:00 AM',v:'Second Visit',st:['Confirmed','p-confirmed']},
      {p:['Laila Begum','01677-112233'],d:['Dr. Ayesha Rahman','Cardiology'],s:'Sun, Sep 14 · 11:00 AM',v:'First Visit',st:['Pending','p-pending']},
      {p:['Hasan Ali','01555-667788'],d:['Dr. Farid Ahmed','Neurology'],s:'Mon, Sep 15 · 03:00 PM',v:'First Visit',st:['Completed','p-completed']},
      {p:['Mina Chowdhury','01344-556677'],d:['Dr. Nusrat Jahan','Pediatrics'],s:'Mon, Sep 15 · 10:00 AM',v:'Report Review',st:['Cancelled','p-cancelled']},
      {p:['Arif Hossain','01799-001122'],d:['Dr. Tanvir Hasan','Orthopedics'],s:'Tue, Sep 16 · 09:00 AM',v:'Second Visit',st:['Confirmed','p-confirmed']},
      {p:['Nadia Islam','01888-334455'],d:['Dr. Farid Ahmed','Neurology'],s:'Tue, Sep 16 · 02:00 PM',v:'First Visit',st:['Pending','p-pending']}
    ],
    render:(r,i)=>`<td class="mx-idx">${String(i+1).padStart(2,'0')}</td>
      <td><div class="mx-who"><span class="mx-av ${AV[i%AV.length]}">${initials(r.p[0])}</span><span><b>${r.p[0]}</b><span>${r.p[1]}</span></span></div></td>
      <td><b>${r.d[0]}</b><br><span style="font-size:12px;color:var(--mut)">${r.d[1]}</span></td>
      <td class="mx-num">${r.s}</td><td>${r.v}</td><td>${pill(...r.st)}</td>
      <td><div class="mx-acts"><button class="pri">Review</button><button>Edit</button></div></td>`
  },
  doctors: {
    kicker:'MediCare · Staff', title:'Doc<em>tors</em>',
    sub:'Who is on the roster, where they sit, and whether they take bookings.',
    add:'+ Add doctor',
    vitals:[['On roster','24','6 departments',''],['Active','21','taking bookings',''],['On leave','2','back Monday','warn'],['Inactive','1','re-verify','']],
    filters:['All','Active','Inactive'],
    cols:['#','Doctor','Department','Specialist','Phone','Status','Actions'],
    rows:[
      {p:['Dr. Ayesha Rahman','MBBS, MD'],d:'Cardiology',s:'Interventional',ph:'01711-000111',st:['Active','p-active']},
      {p:['Dr. Tanvir Hasan','MBBS, MS'],d:'Orthopedics',s:'Sports injury',ph:'01811-000222',st:['Active','p-active']},
      {p:['Dr. Nusrat Jahan','MBBS, DCH'],d:'Pediatrics',s:'Neonatal',ph:'01911-000333',st:['Active','p-active']},
      {p:['Dr. Farid Ahmed','MBBS, PhD'],d:'Neurology',s:'Stroke care',ph:'01611-000444',st:['Active','p-active']},
      {p:['Dr. Selina Akter','MBBS, FCPS'],d:'Gynecology',s:'High-risk pregnancy',ph:'01511-000555',st:['Inactive','p-inactive']},
      {p:['Dr. Kamal Pasha','MBBS, MD'],d:'Dermatology',s:'Cosmetic',ph:'01311-000666',st:['Active','p-active']}
    ],
    render:(r,i)=>`<td class="mx-idx">${String(i+1).padStart(2,'0')}</td>
      <td><div class="mx-who"><span class="mx-av t">${initials(r.p[0])}</span><span><b>${r.p[0]}</b><span>${r.p[1]}</span></span></div></td>
      <td>${r.d}</td><td>${r.s}</td><td class="mx-num">${r.ph}</td><td>${pill(...r.st)}</td>
      <td><div class="mx-acts"><button class="pri">Schedule</button><button>Edit</button><button class="danger">Off</button></div></td>`
  },
  patients: {
    kicker:'MediCare · Records', title:'Pati<em>ents</em>',
    sub:'Registered patients and how active their care is.',
    add:'+ Add patient',
    vitals:[['Registered','1,204','+38 this month',''],['With visits','862','72% engaged',''],['New this week','41','up 12%',''],['Inactive','342','no visit in 1y','warn']],
    filters:['All','Active','Inactive'],
    cols:['#','Patient','Contact','Gender','Born','Visits','Status','Actions'],
    rows:[
      {p:['Rahim Uddin','rahim@example.com'],c:'01711-223344',g:'Male',b:'1988',v:'6 visits',st:['Active','p-active']},
      {p:['Sara Khan','sara@example.com'],c:'01812-998877',g:'Female',b:'1995',v:'3 visits',st:['Active','p-active']},
      {p:['Karim Sheikh','karim@example.com'],c:'01933-445566',g:'Male',b:'1974',v:'11 visits',st:['Active','p-active']},
      {p:['Laila Begum','laila@example.com'],c:'01677-112233',g:'Female',b:'1962',v:'1 visit',st:['Inactive','p-inactive']},
      {p:['Hasan Ali','hasan@example.com'],c:'01555-667788',g:'Male',b:'2001',v:'2 visits',st:['Active','p-active']}
    ],
    render:(r,i)=>`<td class="mx-idx">${String(i+1).padStart(2,'0')}</td>
      <td><div class="mx-who"><span class="mx-av ${AV[(i+1)%AV.length]}">${initials(r.p[0])}</span><span><b>${r.p[0]}</b><span>${r.p[1]}</span></span></div></td>
      <td class="mx-num">${r.c}</td><td>${r.g}</td><td class="mx-num">${r.b}</td><td>${r.v}</td><td>${pill(...r.st)}</td>
      <td><div class="mx-acts"><button class="pri">Record</button><button>Edit</button></div></td>`
  },
  departments: {
    kicker:'MediCare · Structure', title:'Depart<em>ments</em>',
    sub:'Clinical units, their load, and availability.',
    add:'+ Add department',
    vitals:[['Units','6','all staffed',''],['Doctors','24','avg 4 per unit',''],['Open today','6','full coverage',''],['Closed','0','none','']],
    filters:['All','Active','Inactive'],
    cols:['#','Department','Load','Head','Status','Actions'],
    rows:[
      {p:['Cardiology','Heart & vascular'],l:'18 doctors · 42 beds',h:'Dr. Ayesha Rahman',st:['Active','p-active']},
      {p:['Orthopedics','Bones & joints'],l:'9 doctors · 24 beds',h:'Dr. Tanvir Hasan',st:['Active','p-active']},
      {p:['Pediatrics','Children'],l:'12 doctors · 30 beds',h:'Dr. Nusrat Jahan',st:['Active','p-active']},
      {p:['Neurology','Brain & nerves'],l:'7 doctors · 16 beds',h:'Dr. Farid Ahmed',st:['Active','p-active']},
      {p:['Dermatology','Skin'],l:'5 doctors · 8 beds',h:'Dr. Kamal Pasha',st:['Active','p-active']},
      {p:['Oncology','Cancer care'],l:'— · opening soon',h:'TBD',st:['Inactive','p-inactive']}
    ],
    render:(r,i)=>`<td class="mx-idx">${String(i+1).padStart(2,'0')}</td>
      <td><div class="mx-who"><span class="mx-av b">${initials(r.p[0])}</span><span><b>${r.p[0]}</b><span>${r.p[1]}</span></span></div></td>
      <td>${r.l}</td><td>${r.h}</td><td>${pill(...r.st)}</td>
      <td><div class="mx-acts"><button class="pri">Open</button><button>Edit</button></div></td>`
  },
  blog: {
    kicker:'MediCare · Publishing', title:'Bl<em>og</em>',
    sub:'Patient education pipeline — drafts become trust.',
    add:'+ New post',
    vitals:[['Posts','86','12 this month',''],['Published','71','live',''],['Drafts','9','needs review','warn'],['Comments','23','4 pending','warn']],
    filters:['All','Published','Draft'],
    cols:['#','Post','Category','Author','Date','Status','Actions'],
    rows:[
      {p:['5 Early Signs of Heart Disease','Heart health · 6 min read'],c:'Cardiology',a:'Dr. Ayesha Rahman',d:'Sep 10, 2026',st:['Published','p-published']},
      {p:['Childhood Vaccination Schedule','Pediatrics · 4 min read'],c:'Pediatrics',a:'Dr. Nusrat Jahan',d:'Sep 08, 2026',st:['Published','p-published']},
      {p:['Preparing for Knee Surgery','Orthopedics · 8 min read'],c:'Orthopedics',a:'Dr. Tanvir Hasan',d:'Sep 05, 2026',st:['Draft','p-draft']},
      {p:['Understanding Migraine Triggers','Neurology · 5 min read'],c:'Neurology',a:'Dr. Farid Ahmed',d:'Sep 02, 2026',st:['Published','p-published']},
      {p:['Skin Care in Monsoon','Dermatology · 3 min read'],c:'Dermatology',a:'Dr. Kamal Pasha',d:'Aug 28, 2026',st:['Draft','p-draft']}
    ],
    render:(r,i)=>`<td class="mx-idx">${String(i+1).padStart(2,'0')}</td>
      <td><div class="mx-who"><span class="mx-av a">✚</span><span><b>${r.p[0]}</b><span>${r.p[1]}</span></span></div></td>
      <td>${r.c}</td><td>${r.a}</td><td class="mx-num">${r.d}</td><td>${pill(...r.st)}</td>
      <td><div class="mx-acts"><button class="pri">Edit</button><button>View</button></div></td>`
  }
};

let mod = 'appointments', filter = 'All', q = '', page = 1;
const PER = 5;
const $ = id => document.getElementById(id);

function statusOf(r){ const m = MODULES[mod]; return m.filters.find(f => f !== 'All' && r.st[0] === f) || 'All'; }

function filtered(){
  const rows = MODULES[mod].rows;
  return rows.map((r,i)=>({...r,_i:i})).filter(r => {
    if (filter !== 'All' && statusOf(r) !== filter) return false;
    if (q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
    return true;
  });
}

function render(){
  const m = MODULES[mod];
  $('kicker').textContent = m.kicker;
  $('title').innerHTML = m.title;
  $('sub').textContent = m.sub;
  $('addBtn').textContent = m.add;
  $('vitals').innerHTML = m.vitals.map(v=>`<div class="mx-v ${v[3]}"><div class="k">${v[0]}</div><div class="v">${v[1]}</div><div class="s">${v[2]}</div></div>`).join('');
  $('mods').innerHTML = Object.keys(MODULES).map(k=>`<button data-m="${k}" class="${k===mod?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('');
  $('filters').innerHTML = m.filters.map(f=>{
    const dot = f==='All'?'':`<span class="mx-dot" style="background:${f==='Pending'||f==='Draft'?'var(--amber-dot)':f==='Cancelled'||f==='Inactive'?'var(--faint)':'var(--teal)'}"></span>`;
    return `<button data-f="${f}" class="${f===filter?'on':''}">${dot}${f}</button>`;
  }).join('');
  $('head').innerHTML = m.cols.map((c,i)=>`<th${i===m.cols.length-1?' style="text-align:right"':''}>${c}</th>`).join('');

  const all = filtered();
  const pages = Math.max(1, Math.ceil(all.length / PER));
  if (page > pages) page = 1;
  const slice = all.slice((page-1)*PER, page*PER);
  $('rowCount').textContent = `${all.length} record${all.length===1?'':'s'}`;
  $('body').innerHTML = slice.length
    ? slice.map(r=>`<tr>${m.render(r, r._i)}</tr>`).join('')
    : `<tr><td colspan="${m.cols.length}"><div class="mx-empty"><b>Nothing on this chart</b>No records match “${q||filter}”. Clear the search or pick another triage tab.</div></td></tr>`;
  $('pgInfo').textContent = `Showing ${slice.length?((page-1)*PER+1):0}–${(page-1)*PER+slice.length} of ${all.length}`;
  let nav = `<button data-pg="${page-1}" ${page===1?'disabled':''}>‹</button>`;
  for (let p=1;p<=pages;p++) nav += `<button data-pg="${p}" class="${p===page?'on':''}">${p}</button>`;
  nav += `<button data-pg="${page+1}" ${page===pages?'disabled':''}>›</button>`;
  $('pgNav').innerHTML = nav;

  document.querySelectorAll('#mods button').forEach(b=>b.onclick=()=>{mod=b.dataset.m;filter='All';q='';$('q').value='';page=1;render();});
  document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;page=1;render();});
  document.querySelectorAll('#pgNav button').forEach(b=>b.onclick=()=>{if(!b.disabled){page=+b.dataset.pg;render();}});
}
$('q').addEventListener('input', e=>{q=e.target.value.trim().toLowerCase();page=1;render();});
render();
</script>
</body>
</html>
